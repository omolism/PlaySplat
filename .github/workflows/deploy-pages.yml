name: Deploy to GitHub Pages

# Pages was previously serving the repository root, which handed visitors the
# unbuilt index.html and its bare `/src/main.js` import. This builds the Vite
# bundle instead and publishes dist/.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; let an in-flight one finish so a half-written
# site is not published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        # The site is published on the custom apex domain playsplats.com, which
        # serves from the root, so the base is "/" and not the repository slug.
        # Every public asset resolves against import.meta.env.BASE_URL, so this
        # single value is all that changes if the deployment ever moves back to
        # a github.io project path.
        env:
          VITE_BASE: /
        run: npm run build

      - name: Disable Jekyll
        # Without this, Pages runs the output through Jekyll, which drops any
        # file or directory whose name begins with an underscore.
        run: touch dist/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
